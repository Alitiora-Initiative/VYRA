name: VYRA Sentinel

on:
  push:
    paths:
      - "hackathons/vyra-risk-review/**"
      - ".github/workflows/vyra-sentinel.yml"
  pull_request:
    paths:
      - "hackathons/vyra-risk-review/**"
      - ".github/workflows/vyra-sentinel.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hackathons/vyra-risk-review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --check src/decision-engine.mjs && node --check src/mozaik-team.mjs && node --check src/demo-runner.mjs && node --check src/cli.mjs
      - run: npm test
