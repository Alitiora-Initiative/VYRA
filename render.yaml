services:
  - type: web
    name: vyra-markets
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
